<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Status - Miraidon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body{background:#020617;color:white;font-family:monospace;padding:60px 20px;}.card{background:#0f172a;border:1px solid #1e293b;border-radius:16px;padding:30px;}</style>
</head>
<body>
    <div class="max-w-2xl mx-auto">
        <h1 class="text-3xl font-black text-center mb-12 uppercase text-blue-500">System Pulse</h1>
        <div class="card mb-8">
            <div class="text-xs text-slate-500 uppercase mb-2">Support Desk</div>
            <div id="state" class="text-2xl font-black uppercase">Scanning...</div>
            <div id="win" class="text-[10px] text-slate-500 font-bold mt-2 uppercase"></div>
        </div>
        <div class="card">
            <div class="text-xs text-slate-500 uppercase mb-4">Nodes</div>
            <div id="grid" class="space-y-4"></div>
        </div>
    </div>
    <script>
        async function load() {
            try {
                var res = await fetch("/api/status"); var data = await res.json();
                var s = document.getElementById("state");
                if (data.support.isOpen) { s.innerText = "OPERATIONAL"; s.className = "text-2xl font-black uppercase text-green-500"; }
                else { s.innerText = "TEMPORARILY UNAVAILABLE"; s.className = "text-2xl font-black uppercase text-red-500"; }
                document.getElementById("win").innerText = "Schedule: " + data.support.window;
                var g = document.getElementById("grid"); g.innerHTML = "";
                for (var i=0; i<data.fleet.length; i++) {
                    var n = data.fleet[i]; var d = document.createElement("div"); d.className = "flex justify-between p-4 bg-slate-950 rounded border border-slate-800";
                    d.innerHTML = '<span class="font-bold uppercase text-sm">'+n.name+'</span><span class="text-[10px] text-green-500">ONLINE</span>';
                    g.appendChild(d);
                }
            } catch(e){}
        }
        load();
    </script>
</body>
</html>
