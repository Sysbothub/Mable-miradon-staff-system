<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FAQ - Miraidon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body{background:#020617;color:white;font-family:monospace;padding:60px 20px;}.item{background:#0f172a;border:1px solid #1e293b;border-radius:12px;margin-bottom:20px;padding:25px;}</style>
</head>
<body>
    <div class="max-w-3xl mx-auto">
        <h1 class="text-4xl font-black text-center mb-16 uppercase text-blue-500">Knowledge Base</h1>
        <div id="list"></div>
    </div>
    <script>
        async function load() {
            var res = await fetch("/api/faq"); var data = await res.json(); var list = document.getElementById("list");
            for (var i=0; i<data.length; i++) {
                var d = document.createElement("div"); d.className = "item";
                d.innerHTML = '<div class="font-bold uppercase mb-2 text-lg cursor-pointer" onclick="t(this)">'+data[i].question+'</div><div class="text-slate-400 text-sm hidden">'+data[i].answer+'</div>';
                list.appendChild(d);
            }
        }
        function t(el) { var a = el.nextElementSibling; if (a.classList.contains("hidden")) { a.classList.remove("hidden"); } else { a.classList.add("hidden"); } }
        load();
    </script>
</body>
</html>
