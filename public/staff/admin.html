<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Console - Miraidon Trade Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-color: #020617; 
            color: white; 
            font-family: 'Courier New', Courier, monospace; 
        }
        input, select, textarea { 
            background-color: #0f172a; 
            border: 1px solid #334155; 
            padding: 8px; 
            width: 100%; 
            color: white; 
            outline: none; 
            border-radius: 4px;
            font-size: 12px;
        }
        input:focus, select:focus, textarea:focus { border-color: #6366f1; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .section-header { font-weight: bold; margin-bottom: 12px; padding-bottom: 4px; border-bottom: 1px solid; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body class="p-6 h-screen flex flex-col overflow-hidden">
    
    <nav class="mb-6 flex justify-between items-center shrink-0">
        <span class="font-bold text-amber-500 text-xl tracking-wider">MIRAIDON TRADE SERVICES / ADMIN</span>
        <a href="/staff/dashboard.html" class="text-xs text-slate-400 hover:text-white border border-slate-700 px-4 py-2 rounded transition hover:bg-slate-800">← DASHBOARD</a>
    </nav>
    
    <div class="flex-1 overflow-y-auto space-y-8 pr-2 pb-10">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="p-6 border border-teal-900 rounded bg-slate-900/50">
                <h2 class="section-header text-teal-400 border-teal-900">SYSTEM CONFIGURATION</h2>
                <div class="flex items-center justify-between mb-4 bg-slate-950 p-3 rounded border border-slate-800">
                    <label class="text-sm font-bold text-slate-300">SYSTEM ONLINE</label>
                    <input type="checkbox" id="cfg-online" class="w-5 h-5 accent-teal-500">
                </div>
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div><label class="text-[10px] text-slate-400 font-bold block mb-1">OPEN (AST)</label><input type="time" id="cfg-open"></div>
                    <div><label class="text-[10px] text-slate-400 font-bold block mb-1">CLOSE (AST)</label><input type="time" id="cfg-close"></div>
                </div>
                <label class="text-[10px] text-slate-400 font-bold block mb-1">OFFLINE REASON</label>
                <input id="cfg-note" class="mb-4" placeholder="Day off message...">
                <button onclick="saveConfig()" class="w-full bg-teal-600 hover:bg-teal-500 text-white p-3 rounded font-bold text-xs transition">SAVE SETTINGS</button>
            </div>
            <div class="p-6 border border-indigo-900 rounded bg-slate-900/50 shadow-lg shadow-indigo-900/10">
                <h2 class="section-header text-indigo-400 border-indigo-900">LICENSE ACTIVATION</h2>
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <input id="lk" placeholder="License Key">
                    <input id="ld" placeholder="Discord User ID">
                </div>
                <input id="li" placeholder="Instance ID / HWID" class="mb-4">
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <input id="sn" placeholder="Server Name">
                    <input id="sid" placeholder="Server ID">
                </div>
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <select id="dur"><option value="30 Days">30 Days</option><option value="90 Days">90 Days</option><option value="Lifetime">Lifetime</option></select>
                    <select id="type"><option value="Premium Bundle">Premium Bundle</option><option value="Mable Rental">Mable Rental</option></select>
                </div>
                <button onclick="lic()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white p-3 rounded font-bold text-xs transition">ACTIVATE & NOTIFY</button>
            </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="p-6 border border-amber-900 rounded bg-slate-900/50">
                <h2 class="section-header text-amber-400 border-amber-900">STAFF MANAGEMENT <button onclick="load()" class="text-[10px] text-slate-500 hover:text-white border border-slate-700 px-2 py-1 rounded">REFRESH</button></h2>
                <div id="staff" class="h-32 overflow-y-auto mb-4 text-xs border border-slate-800 p-2 rounded bg-slate-950"></div>
                <div class="flex gap-2 mb-2"><input id="su" placeholder="User" class="w-1/3"><input id="sd" placeholder="ID" class="w-1/3"><button onclick="addS()" class="bg-amber-600 text-white w-1/3 rounded font-bold text-xs">ADD</button></div>
                <label class="text-[10px] text-slate-400"><input type="checkbox" id="sa" style="width:auto"> Grant Admin</label>
            </div>
            <div class="p-6 border border-blue-900 rounded bg-slate-900/50 shadow-lg shadow-blue-900/10">
                <h2 class="section-header text-blue-400 border-blue-900">MANUAL TICKET</h2>
                <input id="md-id" placeholder="Discord User ID" class="mb-4">
                <div class="flex gap-2"><input id="md-msg" placeholder="Message content..."><button onclick="openTicket()" class="bg-blue-600 text-white w-32 rounded font-bold text-xs">OPEN</button></div>
            </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="p-6 border border-purple-900 rounded bg-slate-900/50 shadow-lg shadow-purple-900/10">
                <h2 class="section-header text-purple-400 border-purple-900">MACRO EDITOR</h2>
                <div id="macro-list" class="h-24 overflow-y-auto mb-4 text-xs border border-slate-800 p-2 rounded bg-slate-950"></div>
                <div class="mb-2"><input id="mt" placeholder="Title"></div>
                <div class="flex gap-2"><input id="mc" placeholder="Content..."><button onclick="addMacro()" class="bg-purple-600 text-white w-24 rounded font-bold text-xs">ADD</button></div>
            </div>
            <div class="p-6 border border-pink-900 rounded bg-slate-900/50 shadow-lg shadow-pink-900/10">
                <h2 class="section-header text-pink-400 border-pink-900">FAQ EDITOR</h2>
                <div class="flex gap-2 mb-2"><input id="fq" placeholder="Question"><button onclick="addFaq()" class="bg-pink-600 text-white w-24 rounded font-bold text-xs transition">ADD</button></div>
                <textarea id="fa" placeholder="Answer..." class="h-24"></textarea>
            </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="p-6 border border-red-900 rounded bg-slate-900/50">
                <h2 class="section-header text-red-400 border-red-900">GLOBAL BROADCAST</h2>
                <p class="text-xs text-slate-400 mb-4 bg-red-900/20 p-2 border border-red-900/50">DMs every single server owner Miraidon is in.</p>
                <div class="flex gap-2"><input id="bm" placeholder="Message..."><button onclick="broadcast()" class="bg-red-600 text-white w-32 rounded font-bold text-xs">SEND ALL</button></div>
            </div>
            <div class="p-6 border border-slate-700 rounded bg-slate-900/50 shadow-lg">
                <h2 class="section-header text-slate-300 border-slate-700">ACTIVE FLEET & SERVERS</h2>
                <div id="server-list" class="grid grid-cols-1 gap-4 max-h-48 overflow-y-auto"></div>
            </div>
        </div>
    </div>

    <script>
        async function req(url, method, body) {
            if (method === undefined) method = 'GET';
            const options = { method: method, headers: { 'Content-Type': 'application/json' } };
            if (body) options.body = JSON.stringify(body);
            const response = await fetch(url, options);
            if (response.status === 401) window.location.href = '/login.html';
            return await response.json();
        }

        async function load() {
            try {
                const config = await req('/api/admin/config');
                document.getElementById('cfg-online').checked = config.supportOnline;
                document.getElementById('cfg-note').value = config.offlineNote;
                document.getElementById('cfg-open').value = config.openTime;
                document.getElementById('cfg-close').value = config.closeTime;
            } catch(e) {}
            const staff = await req('/api/admin/stats');
            document.getElementById('staff').innerHTML = staff.map(function(s) {
                return `<div class="flex justify-between p-2 border-b border-slate-800 hover:bg-slate-900"><span>${s.username} ${s.isAdmin ? '(A)' : ''}</span><div class="flex gap-2"><button onclick="resetPass('${s._id}')" class="text-blue-400">RESET</button><button onclick="delS('${s._id}')" class="text-red-500">DEL</button></div></div>`;
            }).join('');
            const macros = await req('/api/macros');
            document.getElementById('macro-list').innerHTML = macros.map(function(m) {
                return `<div class="flex justify-between p-2 border-b border-slate-800"><span>${m.title}</span><button onclick="delMacro('${m._id}')" class="text-red-500">✕</button></div>`;
            }).join('');
            const servers = await req('/api/admin/servers');
            document.getElementById('server-list').innerHTML = servers.map(function(s) {
                return `<div class="p-4 bg-slate-950 border border-slate-800 rounded flex flex-col justify-between group"><div><div class="font-bold text-sm truncate">${s.name}</div><div class="text-[10px] text-slate-500 flex justify-between mt-2"><span>👥 ${s.members} Members</span><span class="text-indigo-400">🤖 ${s.botName}</span></div></div><div class="flex gap-2 mt-4 opacity-75 group-hover:opacity-100 transition"><button onclick="mkInv('${s.id}','${s.botId}')" class="flex-1 bg-blue-900/50 hover:bg-blue-600 text-blue-200 rounded py-1 text-[10px]">LINK</button><button onclick="dmOwn('${s.id}','${s.botId}')" class="flex-1 bg-amber-900/50 hover:bg-amber-600 text-amber-200 rounded py-1 text-[10px]">OWNER</button><button onclick="leaveS('${s.id}','${s.botId}')" class="flex-1 bg-red-900/50 hover:bg-red-600 text-red-200 rounded py-1 text-[10px]">LEAVE</button></div></div>`;
            }).join('');
        }

        async function saveConfig() { await req('/api/admin/config/toggle', 'POST', { status: document.getElementById('cfg-online').checked, note: document.getElementById('cfg-note').value, openTime: document.getElementById('cfg-open').value, closeTime: document.getElementById('cfg-close').value }); alert("Config Saved."); }
        async function lic() { await req('/api/admin/license/activate', 'POST', { license_key: document.getElementById('lk').value, discord_id: document.getElementById('ld').value, instance_name: document.getElementById('li').value, server_name: document.getElementById('sn').value, server_id: document.getElementById('sid').value, type: document.getElementById('type').value, duration: document.getElementById('dur').value, channel_id: '000' }); alert("License Active."); }
        async function addS() { await req('/api/admin/staff/add', 'POST', { username: document.getElementById('su').value, discordId: document.getElementById('sd').value, adminStatus: document.getElementById('sa').checked }); load(); }
        async function delS(id) { if(confirm("Del?")) { await req('/api/admin/staff/delete', 'POST', { staffId: id }); load(); } }
        async function resetPass(id) { if(confirm("Force reset?")) { await req('/api/admin/staff/reset', 'POST', { staffId: id }); alert("New key sent."); } }
        async function addMacro() { await req('/api/admin/macros/add', 'POST', { title: document.getElementById('mt').value, content: document.getElementById('mc').value }); load(); }
        async function delMacro(id) { await req('/api/admin/macros/delete', 'POST', { id: id }); load(); }
        async function addFaq() { await req('/api/admin/faq/add', 'POST', { question: document.getElementById('fq').value, answer: document.getElementById('fa').value }); alert("FAQ Added."); }
        async function openTicket() { await req('/api/admin/manual-dm', 'POST', { discordId: document.getElementById('md-id').value, content: document.getElementById('md-msg').value }); alert("Ticket Opened."); }
        async function mkInv(s, b) { const r = await req('/api/admin/create-invite', 'POST', { serverId: s, botId: b }); if (r.url) prompt("Link:", r.url); }
        async function dmOwn(s, b) { const m = prompt("Message:"); if (m) await req('/api/admin/dm-owner', 'POST', { serverId: s, botId: b, message: m }); }
        async function leaveS(s, b) { if(confirm("Leave?")) { await req('/api/admin/leave-server', 'POST', { serverId: s, botId: b }); load(); } }
        async function broadcast() { if(confirm("Broadcasting to ALL owners! Continue?")) { const r = await req('/api/admin/bulk-message', 'POST', { message: document.getElementById('bm').value }); alert("Sent to " + r.sentTo + " owners."); } }
        load();
    </script>
</body>
</html>
