<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin - Miraidon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020617; color: white; font-family: monospace; padding: 40px; margin: 0; }
        .card { background-color: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 30px; margin-bottom: 24px; }
        input, textarea, select { background-color: #020617; border: 1px solid #334155; padding: 12px; width: 100%; border-radius: 8px; color: white; outline: none; margin-bottom: 10px; }
        input:focus { border-color: #3b82f6; }
        button { cursor: pointer; transition: all 0.2s; }
        .fleet-btn { font-size: 9px; font-weight: 900; text-transform: uppercase; padding: 6px; border-radius: 4px; width: 100%; margin-top: 4px; border: 1px solid #334155; color: #94a3b8; }
        .fleet-btn:hover { background: #1e293b; color: white; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">
    <header class="flex justify-between items-center mb-10 shrink-0">
        <h1 class="text-3xl font-black text-amber-500 uppercase tracking-tighter">System Administration</h1>
        <div class="flex gap-4">
            <button onclick="syncData()" class="bg-slate-800 px-6 py-2 rounded font-bold uppercase text-[10px]">Sync All</button>
            <a href="/staff/dashboard.html" class="bg-blue-600 px-6 py-2 rounded font-bold uppercase text-[10px]">Terminal</a>
        </div>
    </header>

    <div class="flex-1 overflow-y-auto space-y-8 pr-4">
        
        <div class="card">
            <h2 class="text-blue-400 font-black uppercase text-sm mb-6 border-b border-slate-800 pb-2">Active Fleet Nodes</h2>
            <div id="fleet-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>

        <div class="card">
            <h2 class="text-blue-200 font-black uppercase text-sm mb-6">Direct Message Dispatch</h2>
            <div class="flex gap-4">
                <input id="dm-id" placeholder="Discord User ID" class="w-1/3">
                <input id="dm-content" placeholder="Message Payload" class="flex-1">
                <button onclick="manualDm()" class="bg-blue-800 px-6 rounded font-black uppercase text-xs">Send</button>
            </div>
        </div>

        <div class="card">
            <h2 class="text-green-500 font-black uppercase text-sm mb-6">Global Schedule & Status</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-4">
                    <label class="text-xs uppercase text-slate-500">Override</label>
                    <div class="flex gap-4">
                        <button onclick="setConfig(true)" class="flex-1 bg-green-900/30 text-green-500 border border-green-900 py-3 rounded font-bold uppercase text-xs">Open</button>
                        <button onclick="setConfig(false)" class="flex-1 bg-red-900/30 text-red-500 border border-red-900 py-3 rounded font-bold uppercase text-xs">Close</button>
                    </div>
                    <input id="note" placeholder="Closure Note">
                </div>
                <div class="space-y-4">
                    <label class="text-xs uppercase text-slate-500">Hours (AST)</label>
                    <div class="flex gap-4">
                        <input type="time" id="openTime">
                        <input type="time" id="closeTime">
                    </div>
                    <button onclick="saveHours()" class="w-full bg-slate-800 py-3 rounded font-bold uppercase text-xs">Save</button>
                </div>
            </div>
        </div>

        <div class="card">
            <h2 class="text-purple-500 font-black uppercase text-sm mb-6">Staff Performance</h2>
            <div id="stats-grid" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
        </div>

        <div class="card">
            <h2 class="text-cyan-500 font-black uppercase text-sm mb-6">Macro Configuration</h2>
            <div class="space-y-4">
                <input id="macro-title" placeholder="Macro Title">
                <textarea id="macro-content" rows="3" placeholder="Response Content"></textarea>
                <button onclick="addMacro()" class="w-full bg-cyan-600 py-3 rounded font-black text-xs uppercase tracking-widest">Create Macro</button>
            </div>
        </div>

        <div class="card">
            <h2 class="text-indigo-500 font-black uppercase text-sm mb-6">License Management</h2>
            <div class="space-y-4">
                <div class="flex gap-4">
                    <input id="lic-query" placeholder="Enter License Key to Edit" class="flex-1">
                    <button onclick="checkLicense()" class="bg-indigo-600 px-6 rounded font-black uppercase text-xs">Search</button>
                </div>
                
                <div id="lic-editor" class="hidden space-y-4 p-4 bg-slate-950 rounded border border-slate-800">
                    <div class="text-xs text-slate-500 font-bold uppercase mb-2">Assign Details</div>
                    <input id="edit-key" type="hidden">
                    <div class="grid grid-cols-3 gap-4">
                        <div class="space-y-1">
                            <label class="text-[10px] text-slate-500 uppercase">Server Name</label>
                            <input id="edit-server" placeholder="Server Name">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[10px] text-slate-500 uppercase">Server ID</label>
                            <input id="edit-sid" placeholder="Server ID">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[10px] text-slate-500 uppercase">Discord ID</label>
                            <input id="edit-did" placeholder="User ID">
                        </div>
                    </div>
                    <div class="flex justify-between items-center mt-4">
                        <div id="lic-info" class="text-xs text-slate-400 font-bold"></div>
                        <button onclick="updateLicense()" class="bg-green-600 px-6 py-2 rounded font-bold uppercase text-xs">Update Assignment</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2 class="text-pink-500 font-black uppercase text-sm mb-6">Knowledge Base</h2>
            <div class="space-y-4">
                <input id="q" placeholder="Question">
                <textarea id="a" rows="3" placeholder="Answer"></textarea>
                <button onclick="addFaq()" class="w-full bg-pink-600 py-3 rounded font-black text-xs uppercase tracking-widest">Add FAQ</button>
            </div>
        </div>

        <div class="card max-w-xl">
            <h2 class="text-amber-500 font-black uppercase text-sm mb-6">Staff Provisioning</h2>
            <div class="space-y-4">
                <input id="u" placeholder="Username">
                <input id="d" placeholder="Discord ID">
                <button onclick="addStaff()" class="w-full bg-amber-600 py-3 rounded font-black text-xs uppercase tracking-widest">Create Account</button>
            </div>
        </div>

    </div>

    <script>
        async function syncData() 
        {
            // Fleet
            const sRes = await fetch("/api/admin/servers");
            const servers = await sRes.json();
            const cRes = await fetch("/api/admin/config");
            const conf = await cRes.json();

            document.getElementById("note").value = conf.offlineNote || "";
            document.getElementById("openTime").value = conf.openTime || "08:00";
            document.getElementById("closeTime").value = conf.closeTime || "23:59";

            const grid = document.getElementById("fleet-grid");
            grid.innerHTML = "";
            for (var i = 0; i < servers.length; i++)
            {
                var s = servers[i];
                var act = true;
                if (conf.botFleetStatus) {
                    for (var j=0; j<conf.botFleetStatus.length; j++) {
                        if (conf.botFleetStatus[j].botId === s.botId) { act = conf.botFleetStatus[j].tradingActive; break; }
                    }
                }
                var d = document.createElement("div");
                d.className = "p-5 bg-slate-950 border border-slate-800 rounded-xl";
                
                // HEADER
                var h = '<div class="mb-4"><div class="font-bold text-sm text-white truncate">'+s.name+'</div><div class="text-[10px] text-slate-500 uppercase font-bold">'+s.botName+'</div></div>';
                
                // TRADING TOGGLE
                var tBtn = '<button onclick="toggleTrade(\''+s.botId+'\', '+!act+')" class="w-full text-[10px] font-black py-2 rounded border uppercase transition '+(act?"border-green-500 text-green-500 hover:bg-green-900/20":"border-red-500 text-red-500 hover:bg-red-900/20")+'">'+(act?"Synthesis: Active":"Synthesis: Maintenance")+'</button>';
                
                // NEW ACTIONS ROW
                var actRow = '<div class="grid grid-cols-3 gap-2 mt-3">';
                actRow += '<button class="fleet-btn hover:text-blue-400 hover:border-blue-400" onclick="genInvite(\''+s.botId+'\', \''+s.id+'\')">Invite</button>';
                actRow += '<button class="fleet-btn hover:text-red-400 hover:border-red-400" onclick="leaveGuild(\''+s.botId+'\', \''+s.id+'\')">Leave</button>';
                actRow += '<button class="fleet-btn hover:text-amber-400 hover:border-amber-400" onclick="dmOwner(\''+s.ownerId+'\')">DM Owner</button>';
                actRow += '</div>';

                d.innerHTML = h + tBtn + actRow;
                grid.appendChild(d);
            }

            // Stats
            const stRes = await fetch("/api/admin/stats");
            const stats = await stRes.json();
            const stGrid = document.getElementById("stats-grid");
            stGrid.innerHTML = "";
            for (var k=0; k<stats.length; k++)
            {
                var st = stats[k];
                var sd = document.createElement("div");
                sd.className = "p-4 bg-slate-950 border border-slate-800 rounded-lg";
                sd.innerHTML = '<div class="font-bold text-purple-400">'+st.username+'</div><div class="text-[10px] text-slate-400 mt-2">Tickets: '+st.ticketsClosed+' | Replies: '+st.repliesSent+'</div>';
                stGrid.appendChild(sd);
            }
        }

        // FLEET ACTIONS
        async function toggleTrade(id, st) { await fetch("/api/admin/fleet/toggle-trading", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ botId: id, status: st }) }); syncData(); }
        
        async function genInvite(botId, guildId) {
            const res = await fetch("/api/admin/guild/invite", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ botId: botId, guildId: guildId }) });
            const d = await res.json();
            if(d.url) { prompt("Invite Link Created:", d.url); } else { alert("Failed to create invite."); }
        }

        async function leaveGuild(botId, guildId) {
            if(!confirm("Force bot to leave this server?")) return;
            await fetch("/api/admin/guild/leave", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ botId: botId, guildId: guildId }) });
            alert("Left guild."); syncData();
        }

        function dmOwner(id) {
            document.getElementById("dm-id").value = id;
            document.getElementById("dm-content").focus();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function manualDm() {
            const id = document.getElementById("dm-id").value;
            const content = document.getElementById("dm-content").value;
            if(!id || !content) return alert("Missing ID or Content");
            await fetch("/api/admin/dm", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ userId: id, content: content }) });
            alert("Message Dispatched.");
            document.getElementById("dm-content").value = "";
        }

        // OTHER ACTIONS
        async function setConfig(s) { await fetch("/api/admin/config/toggle", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ status: s, note: document.getElementById("note").value }) }); syncData(); }
        async function saveHours() { await fetch("/api/admin/config/toggle", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ openTime: document.getElementById("openTime").value, closeTime: document.getElementById("closeTime").value }) }); syncData(); }
        async function addMacro() { await fetch("/api/admin/macro/add", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ title: document.getElementById("macro-title").value, content: document.getElementById("macro-content").value }) }); alert("Macro Added."); }
        
        async function checkLicense() {
            const res = await fetch("/api/admin/license/lookup", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ query: document.getElementById("lic-query").value }) });
            const dat = await res.json();
            const ed = document.getElementById("lic-editor");
            if (dat) { 
                ed.classList.remove("hidden");
                document.getElementById("edit-key").value = dat.key;
                document.getElementById("edit-server").value = dat.serverName;
                document.getElementById("edit-sid").value = dat.serverId;
                document.getElementById("edit-did").value = dat.discordId;
                document.getElementById("lic-info").innerText = "License Type: " + dat.type;
            } else { 
                alert("License Not Found.");
                ed.classList.add("hidden"); 
            }
        }

        async function updateLicense() {
            const payload = {
                key: document.getElementById("edit-key").value,
                serverName: document.getElementById("edit-server").value,
                serverId: document.getElementById("edit-sid").value,
                discordId: document.getElementById("edit-did").value
            };
            await fetch("/api/admin/license/update", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(payload) });
            alert("License Details Updated.");
        }

        async function addFaq() { await fetch("/api/admin/faq/add", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ question: document.getElementById("q").value, answer: document.getElementById("a").value }) }); alert("FAQ Added."); }
        async function addStaff() { await fetch("/api/admin/staff/add", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ username: document.getElementById("u").value, discordId: document.getElementById("d").value }) }); alert("Staff Added."); syncData(); }

        syncData();
    </script>
</body>
</html>
