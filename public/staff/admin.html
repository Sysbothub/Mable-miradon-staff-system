<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Console - Miraidon Trade Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020617; color: white; font-family: 'Courier New', Courier, monospace; }
        input, select, textarea { background-color: #0f172a; border: 1px solid #334155; padding: 8px; width: 100%; color: white; outline: none; border-radius: 4px; font-size: 12px; }
        input:focus, select:focus, textarea:focus { border-color: #6366f1; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .section-header { font-weight: bold; margin-bottom: 12px; padding-bottom: 4px; border-bottom: 1px solid; display: flex; justify-content: space-between; align-items: center; }
        .stat-value { font-size: 14px; color: #f8fafc; font-weight: bold; }
    </style>
</head>
<body class="p-6 h-screen flex flex-col overflow-hidden">
    
    <nav class="mb-6 flex justify-between items-center shrink-0">
        <div class="flex flex-col">
            <span class="font-bold text-amber-500 text-xl tracking-wider uppercase">Miraidon Console</span>
            <span class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">Admin v10.5</span>
        </div>
        <a href="/staff/dashboard.html" class="text-xs text-slate-400 hover:text-white border border-slate-700 px-4 py-2 rounded transition hover:bg-slate-800">← DASHBOARD</a>
    </nav>
    
    <div class="flex-1 overflow-y-auto space-y-8 pr-2 pb-10">

        <div class="p-6 border border-slate-700 rounded bg-slate-900/30">
            <h2 class="section-header text-slate-300 border-slate-700">STAFF PERFORMANCE <button onclick="load()" class="text-[10px] bg-slate-800 px-3 py-1 rounded">REFRESH</button></h2>
            <div class="grid grid-cols-5 gap-4 px-4 py-2 bg-slate-950 border border-slate-800 rounded-t text-[10px] font-black text-slate-500 uppercase tracking-widest">
                <div>User</div><div class="text-center">Closed</div><div class="text-center">Replies</div><div class="text-center">Avg Rating</div><div class="text-right">Actions</div>
            </div>
            <div id="staff-stats-container" class="bg-slate-900/50 border-x border-b border-slate-800 rounded-b divide-y divide-slate-800"></div>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="p-6 border border-teal-900 rounded bg-slate-900/50">
                <h2 class="section-header text-teal-400 border-teal-900">SYSTEM STATUS</h2>
                <div class="flex items-center justify-between mb-4 bg-slate-950 p-4 rounded border border-slate-800">
                    <label class="text-sm font-bold text-slate-200 uppercase">Master Service Toggle</label>
                    <input type="checkbox" id="cfg-online" class="w-6 h-6 accent-teal-500">
                </div>
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div><label class="text-[10px] text-slate-400 font-bold block mb-1">OPEN (AST)</label><input type="time" id="cfg-open"></div>
                    <div><label class="text-[10px] text-slate-400 font-bold block mb-1">CLOSE (AST)</label><input type="time" id="cfg-close"></div>
                </div>
                <input id="cfg-note" class="mb-6" placeholder="Public maintenance notice...">
                <button onclick="saveConfig()" class="w-full bg-teal-600 hover:bg-teal-500 text-white p-3 rounded font-bold text-xs">COMMIT CONFIG</button>
            </div>

            <div class="p-6 border border-indigo-900 rounded bg-slate-900/50">
                <h2 class="section-header text-indigo-400 border-indigo-900">LICENSE ACTIVATION</h2>
                <div class="grid grid-cols-2 gap-4 mb-4"><input id="lk" placeholder="Key"><input id="ld" placeholder="User ID"></div>
                <input id="li" placeholder="Instance ID" class="mb-4">
                <div class="grid grid-cols-2 gap-4 mb-4"><input id="sn" placeholder="Server Name"><input id="sid" placeholder="Server ID"></div>
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <select id="dur"><option value="30 Days">30 Days</option><option value="Lifetime">Lifetime</option></select>
                    <select id="type"><option value="Premium Bundle">Premium Bundle</option><option value="Mable Rental">Mable Rental</option></select>
                </div>
                <button onclick="lic()" class="w-full bg-indigo-600 p-3 rounded font-bold text-xs uppercase transition">Activate License</button>
            </div>
        </div>

        <div class="p-6 border border-slate-700 rounded bg-slate-900/50">
            <h2 class="section-header text-slate-300 border-slate-700">ACTIVE FLEET CONTROL</h2>
            <div id="server-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 max-h-96 overflow-y-auto"></div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="p-6 border border-purple-900 rounded bg-slate-900/50">
                <h2 class="section-header text-purple-400 border-purple-900 uppercase tracking-widest">Macro Response Library</h2>
                <div id="macro-list" class="h-32 overflow-y-auto mb-4 text-xs border border-slate-800 p-2 rounded bg-slate-950 divide-y divide-slate-800"></div>
                <input id="mt" placeholder="Response Title" class="mb-2">
                <textarea id="mc" placeholder="Message content..." class="h-20 mb-2"></textarea>
                <button onclick="addMacro()" class="w-full bg-purple-600 p-2 rounded font-bold text-xs uppercase">Save Response</button>
            </div>
            <div class="p-6 border border-pink-900 rounded bg-slate-900/50">
                <h2 class="section-header text-pink-400 border-pink-900">FAQ DATABASE</h2>
                <input id="fq" placeholder="Question..." class="mb-4">
                <textarea id="fa" placeholder="Answer (Markdown)..." class="h-32 mb-4"></textarea>
                <button onclick="addFaq()" class="w-full bg-pink-600 p-3 rounded font-bold text-xs uppercase tracking-widest">Append FAQ</button>
            </div>
        </div>
    </div>

    <script>
        async function req(u, m, b) {
            const o = { method: m || 'GET', headers: { 'Content-Type': 'application/json' } };
            if (b) o.body = JSON.stringify(b);
            const r = await fetch(u, o);
            if (r.status === 401) window.location.href = '/login.html';
            return await r.json();
        }

        async function load() {
            try {
                const config = await req('/api/admin/config');
                document.getElementById('cfg-online').checked = config.supportOnline;
                document.getElementById('cfg-note').value = config.offlineNote;
                document.getElementById('cfg-open').value = config.openTime;
                document.getElementById('cfg-close').value = config.closeTime;

                const st = await req('/api/admin/stats');
                document.getElementById('staff-stats-container').innerHTML = st.map(m => {
                    const avg = m.ratingCount > 0 ? (m.ratingSum / m.ratingCount).toFixed(2) : 'N/A';
                    return `<div class="grid grid-cols-5 gap-4 px-4 py-3 items-center hover:bg-slate-800/30">
                        <div class="flex items-center gap-3"><img src="${m.avatar}" class="w-8 h-8 rounded-full border border-slate-700"><div><span class="font-bold text-xs block">${m.username}</span><span class="text-[9px] text-slate-500 uppercase">${m.isAdmin ? 'Admin' : 'Staff'}</span></div></div>
                        <div class="text-center stat-value">${m.ticketsClosed}</div>
                        <div class="text-center stat-value">${m.repliesSent}</div>
                        <div class="text-center"><span class="stat-value text-amber-400">${avg}</span><span class="text-[9px] text-slate-600 block">Reviews: ${m.ratingCount}</span></div>
                        <div class="text-right flex justify-end gap-2"><button onclick="resetPass('${m._id}')" class="text-[9px] bg-blue-900/40 text-blue-400 px-2 py-1 rounded">RE-KEY</button><button onclick="delS('${m._id}')" class="text-[9px] bg-red-900/40 text-red-400 px-2 py-1 rounded">PURGE</button></div>
                    </div>`;
                }).join('');

                const mc = await req('/api/macros');
                document.getElementById('macro-list').innerHTML = mc.map(m => `<div class="flex justify-between p-2 hover:bg-slate-900 transition"><span>${m.title}</span><button onclick="delMacro('${m._id}')" class="text-red-500 font-bold px-2">✕</button></div>`).join('');

                const sv = await req('/api/admin/servers');
                document.getElementById('server-list').innerHTML = sv.map(s => {
                    const botState = config.botFleetStatus.find(b => b.botId === s.botId);
                    const isT = botState ? botState.tradingActive : true;
                    return `<div class="p-4 bg-slate-950 border border-slate-800 rounded group">
                        <div class="flex justify-between items-start mb-2"><div class="font-bold text-sm truncate uppercase">${s.name}</div>
                        <button onclick="toggleBotTrading('${s.botId}', ${!isT})" class="text-[9px] font-black px-2 py-1 rounded border ${isT ? 'border-green-900 text-green-500' : 'border-red-900 text-red-500'} tracking-tighter uppercase">${isT ? 'TRADING: ON' : 'TRADING: OFF'}</button></div>
                        <div class="text-[10px] text-slate-500 font-bold uppercase">👥 ${s.members} 🤖 Client: ${s.botName}</div>
                        <div class="flex gap-1 mt-4 opacity-50 group-hover:opacity-100 transition"><button onclick="mkInv('${s.id}','${s.botId}')" class="flex-1 bg-blue-900/50 py-1 text-[9px] font-bold border border-blue-900">INVITE</button><button onclick="leaveS('${s.id}','${s.botId}')" class="flex-1 bg-red-900/50 py-1 text-[9px] font-bold border border-red-900">EJECT</button></div>
                    </div>`;
                }).join('');
            } catch (e) {}
        }

        async function toggleBotTrading(id, status) { await req('/api/admin/fleet/toggle-trading', 'POST', { botId: id, status: status }); load(); }
        async function saveConfig() { await req('/api/admin/config/toggle', 'POST', { status: document.getElementById('cfg-online').checked, note: document.getElementById('cfg-note').value, openTime: document.getElementById('cfg-open').value, closeTime: document.getElementById('cfg-close').value }); alert("Config Saved."); }
        async function resetPass(id) { if(confirm("Reset Key?")) { await req('/api/admin/staff/reset', 'POST', { staffId: id }); alert("New key sent."); } }
        async function delS(id) { if(confirm("Purge?")) { await req('/api/admin/staff/delete', 'POST', { staffId: id }); load(); } }
        async function addMacro() { await req('/api/admin/macros/add', 'POST', { title: document.getElementById('mt').value, content: document.getElementById('mc').value }); load(); }
        async function delMacro(id) { await req('/api/admin/macros/delete', 'POST', { id: id }); load(); }
        async function lic() { await req('/api/admin/license/activate', 'POST', { license_key: document.getElementById('lk').value, discord_id: document.getElementById('ld').value, instance_name: document.getElementById('li').value, server_name: document.getElementById('sn').value, server_id: document.getElementById('sid').value, type: document.getElementById('type').value, duration: document.getElementById('dur').value, channel_id: '000' }); alert("Provisioned."); }
        load();
    </script>
</body>
</html>
