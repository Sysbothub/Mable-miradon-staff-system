<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard - Miraidon Trade Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { 
            background: #020617; 
            color: white; 
            font-family: monospace; 
        }
        .glass { 
            background: rgba(15, 23, 42, 0.95); 
            border: 1px solid #1e293b; 
        }
        ::-webkit-scrollbar { 
            width: 5px; 
        }
        ::-webkit-scrollbar-thumb { 
            background: #3b82f6; 
            border-radius: 5px; 
        }
        /* Avatar Styling */
        .avatar { 
            width: 32px; 
            height: 32px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 1px solid #334155;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">
    
    <audio id="notif-sound" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3"></audio>

    <header class="h-14 glass flex items-center justify-between px-4 shrink-0">
        <div class="flex items-center gap-4">
            <span class="font-bold text-blue-500 text-lg">MIRAIDON TRADE SERVICES / DASHBOARD</span>
            <a href="/staff/admin.html" class="text-xs font-bold text-amber-500 hover:text-white hidden" id="admin-link">ADMIN PANEL</a>
        </div>
        
        <div class="flex gap-2">
            <button onclick="document.getElementById('pw-modal').classList.remove('hidden')" class="text-xs text-slate-400 border border-slate-700 px-3 py-1 rounded hover:text-white transition">CHANGE PASS</button>
            
            <button onclick="fetch('/api/logout', {method:'POST'}).then(function() { window.location.href='/login.html'; })" class="text-xs text-red-500 border border-red-900 px-3 py-1 rounded hover:bg-red-900/20 transition">LOGOUT</button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden">
        
        <aside class="w-72 glass border-r border-slate-800 flex flex-col z-20">
            <div class="p-3 border-b border-slate-800 text-xs font-bold text-slate-500">INBOX</div>
            <div id="thread-list" class="flex-1 overflow-y-auto p-2 space-y-1">
                </div>
        </aside>

        <main class="flex-1 flex flex-col bg-slate-950 relative z-10">
            <div class="h-12 glass border-b border-slate-800 flex items-center justify-between px-4">
                <div>
                    <div id="active-tag" class="text-sm font-bold">Select Ticket</div>
                    <div id="typing" class="text-[10px] text-blue-400 hidden">User is typing...</div>
                </div>
                <div class="flex gap-2 items-center">
                    <div id="viewers" class="text-[10px] text-slate-400 border border-slate-700 px-2 py-1 rounded hidden"></div>
                    <button onclick="closeTicket()" class="text-[10px] bg-red-900/30 text-red-500 border border-red-900 px-3 py-1 rounded hover:bg-red-900/50">ARCHIVE</button>
                </div>
            </div>
            
            <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
            
            <div class="p-3 glass border-t border-slate-800 flex gap-2">
                <input type="file" id="file-in" class="hidden" onchange="fileSel()">
                <button onclick="document.getElementById('file-in').click()" class="bg-slate-800 p-3 rounded text-blue-500 transition hover:bg-slate-700" title="Upload File">+</button>
                
                <div class="relative">
                    <button onclick="toggleMacros()" class="bg-slate-800 p-3 rounded text-amber-500 transition hover:bg-slate-700" title="Quick Replies">⚡</button>
                    <div id="macro-menu" class="hidden absolute bottom-12 left-0 w-48 bg-slate-900 border border-slate-700 rounded shadow-xl max-h-48 overflow-y-auto"></div>
                </div>
                
                <input id="msg-in" class="flex-1 bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:border-blue-500 outline-none" placeholder="Message..." oninput="isTyping()">
                <button onclick="sendMsg()" class="bg-blue-600 px-6 rounded font-bold text-xs hover:bg-blue-500 transition">SEND</button>
            </div>
        </main>

        <aside class="w-80 glass border-l border-slate-800 flex flex-col p-4 z-20">
            <div class="text-xs font-bold text-slate-500 mb-2">USER NOTES</div>
            <textarea id="crm-note" onblur="saveNote()" class="w-full h-32 bg-yellow-900/10 border border-yellow-700/50 p-2 text-xs rounded mb-4 text-yellow-100 outline-none focus:border-yellow-600" placeholder="Internal notes..."></textarea>
            
            <div class="text-xs font-bold text-slate-500 mb-2">HISTORY</div>
            <div id="crm-hist" class="flex-1 overflow-y-auto space-y-2"></div>
        </aside>
    </div>

    <div id="modal" class="hidden fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
        <div class="bg-slate-900 w-full max-w-2xl h-[80vh] rounded border border-slate-700 flex flex-col">
            <div class="p-3 border-b border-slate-700 flex justify-between">
                <span class="font-bold text-slate-300">TRANSCRIPT</span>
                <button onclick="document.getElementById('modal').classList.add('hidden')" class="text-red-500 font-bold">CLOSE</button>
            </div>
            <div id="modal-content" class="flex-1 overflow-y-auto p-4 space-y-2"></div>
        </div>
    </div>

    <div id="pw-modal" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
        <div class="bg-slate-900 w-96 rounded border border-slate-700 p-6 shadow-2xl">
            <h2 class="text-blue-500 font-bold mb-4 text-lg">CHANGE PASSWORD</h2>
            
            <label class="text-[10px] text-slate-400 uppercase font-bold">Current Password</label>
            <input type="password" id="pw-old" class="w-full bg-slate-950 border border-slate-800 p-2 rounded mb-4 text-white focus:border-blue-500 outline-none">
            
            <label class="text-[10px] text-slate-400 uppercase font-bold">New Password</label>
            <input type="password" id="pw-new" class="w-full bg-slate-950 border border-slate-800 p-2 rounded mb-2 text-white focus:border-blue-500 outline-none">
            
            <div class="text-[10px] text-slate-500 mb-6 bg-slate-950 p-2 rounded border border-slate-800">
                <strong>Policy:</strong> Minimum 8 characters. Must contain 1 Capital Letter, 1 Number, and 1 Symbol.
            </div>
            
            <div class="flex gap-2">
                <button onclick="changePW()" class="flex-1 bg-blue-600 hover:bg-blue-500 rounded p-2 text-xs font-bold transition">UPDATE</button>
                <button onclick="document.getElementById('pw-modal').classList.add('hidden')" class="flex-1 bg-slate-800 hover:bg-slate-700 rounded p-2 text-xs transition">CANCEL</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let activeId = null;
        let activeUser = null;
        let currentUser = null;
        let threadStore = {};
        let selectedFile = null;
        let typingTimeout = null;

        /**
         * Function: req
         * Expanded API helper.
         */
        async function req(url, method, body) {
            if (method === undefined) { method = 'GET'; }
            const fetchOptions = { 
                method: method, 
                headers: { 'Content-Type': 'application/json' }
            };
            if (body !== undefined && body !== null) { 
                fetchOptions.body = JSON.stringify(body); 
            }
            
            try {
                const response = await fetch(url, fetchOptions);
                if (response.status === 401) { 
                    window.location.href = '/login.html'; 
                }
                return await response.json();
            } catch (err) {
                console.error("API Error: " + err.message);
                return { error: true };
            }
        }

        // Initialize Session
        (async function() {
            const userProfile = await req('/api/auth/user');
            currentUser = userProfile.username;
            if (userProfile.isAdmin === true) { 
                document.getElementById('admin-link').classList.remove('hidden'); 
            }
            loadThreads();
        })();

        // Function: loadThreads
        async function loadThreads() {
            const list = await req('/api/threads');
            const threadContainer = document.getElementById('thread-list');
            threadContainer.innerHTML = '';
            
            list.forEach(function(thread) {
                threadStore[thread._id] = thread;
                const threadElement = document.createElement('div');
                threadElement.className = "p-3 border-b border-slate-800 hover:bg-slate-800 cursor-pointer " + (activeId === thread._id ? 'bg-blue-900/20' : '');
                
                threadElement.innerHTML = `
                    <div class="flex items-center gap-3">
                        <img src="${thread.userAvatar || 'https://cdn.discordapp.com/embed/avatars/0.png'}" class="avatar">
                        <div class="flex-1 min-w-0">
                            <div class="flex justify-between">
                                <span class="font-bold text-xs text-white truncate">${thread.userTag}</span>
                            </div>
                            <span class="text-[9px] text-slate-500 truncate block">${thread.botName}</span>
                        </div>
                    </div>`;
                
                threadElement.onclick = function() { openThread(thread._id, thread.userId, thread.userTag); };
                threadContainer.appendChild(threadElement);
            });
        }

        // Function: openThread
        function openThread(id, uid, tag) {
            if (activeId !== null) { 
                socket.emit('leave_ticket_room'); 
            }
            activeId = id; 
            activeUser = uid;
            socket.emit('join_ticket_room', { threadId: id, username: currentUser });
            document.getElementById('active-tag').innerText = tag;
            renderChat();
            loadCRM(uid);
            loadThreads();
        }

        // Function: renderChat
        function renderChat() {
            const box = document.getElementById('chat-box');
            box.innerHTML = '';
            const threadData = threadStore[activeId];
            if (threadData === undefined || threadData.messages === undefined) { return; }
            
            threadData.messages.forEach(function(msg) {
                const messageWrapper = document.createElement('div');
                messageWrapper.className = "flex gap-3 max-w-[85%] " + (msg.fromBot === true ? 'self-end flex-row-reverse' : 'self-start flex-row');
                
                const avatarMarkup = `<img src="${msg.authorAvatar || 'https://cdn.discordapp.com/embed/avatars/0.png'}" class="avatar mt-1 shrink-0">`;
                
                let contentMarkup = `<div class="px-3 py-2 rounded text-xs border ${msg.fromBot === true ? 'bg-blue-600 border-blue-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-300'}">${msg.content}</div>`;
                
                if(msg.attachments && msg.attachments.length > 0) {
                    msg.attachments.forEach(function(url) {
                        const isImage = url.match(/\.(jpeg|jpg|gif|png|webp)$/i) !== null;
                        if(isImage === true) {
                            contentMarkup += `<img src="${url}" class="mt-2 max-w-[200px] rounded border border-slate-700 cursor-pointer hover:opacity-80" onclick="window.open('${url}')">`;
                        } else {
                            contentMarkup += `
                                <div class="mt-2">
                                    <a href="${url}" target="_blank" class="flex items-center gap-2 bg-slate-900 border border-slate-700 rounded p-2 text-xs text-blue-400 hover:text-white transition">
                                        <span>📎</span>
                                        <span>Download File</span>
                                    </a>
                                </div>`;
                        }
                    });
                }

                messageWrapper.innerHTML = avatarMarkup + `<div class="flex flex-col ${msg.fromBot === true ? 'items-end' : 'items-start'}">${contentMarkup}<span class="text-[9px] text-slate-600 mt-1">${new Date(msg.timestamp).toLocaleTimeString()}</span></div>`;
                box.appendChild(messageWrapper);
            });
            box.scrollTop = box.scrollHeight;
        }

        // Function: sendMsg
        async function sendMsg() {
            const inputField = document.getElementById('msg-in');
            if(activeId === null || (inputField.value === '' && selectedFile === null)) { return; }
            
            await req('/api/reply', 'POST', { 
                threadId: activeId, 
                content: inputField.value, 
                fileBase64: selectedFile ? selectedFile.base64 : null, 
                fileName: selectedFile ? selectedFile.name : null 
            });
            
            inputField.value = ''; 
            selectedFile = null;
        }

        // Function: closeTicket
        async function closeTicket() {
            if(activeId !== null && confirm("Archive Ticket? This will save the transcript and close the thread.")) {
                await req('/api/close-thread', 'POST', { threadId: activeId });
                activeId = null; 
                document.getElementById('chat-box').innerHTML = '';
                loadThreads();
            }
        }

        // Function: fileSel
        function fileSel() {
            const fileObj = document.getElementById('file-in').files[0];
            const readerInstance = new FileReader();
            readerInstance.onload = function(e) { 
                selectedFile = { base64: e.target.result, name: fileObj.name }; 
            };
            readerInstance.readAsDataURL(fileObj);
        }

        // Function: toggleMacros
        async function toggleMacros() {
            const menuElement = document.getElementById('macro-menu');
            if(menuElement.classList.contains('hidden')) {
                menuElement.classList.remove('hidden');
                const macroList = await req('/api/macros');
                menuElement.innerHTML = macroList.map(function(macro) {
                    return `<div onclick="insMac('${macro.content.replace(/'/g,"\\'")}')" class="p-2 hover:bg-slate-800 cursor-pointer text-xs border-b border-slate-800 text-slate-300">${macro.title}</div>`;
                }).join('');
            } else {
                menuElement.classList.add('hidden');
            }
        }

        // Function: insMac
        function insMac(textValue) {
            const inputField = document.getElementById('msg-in');
            inputField.value += textValue.replace(/{user}/gi, currentUser);
            document.getElementById('macro-menu').classList.add('hidden');
            inputField.focus();
        }

        // Function: loadCRM
        async function loadCRM(uid) {
            const crmData = await req('/api/crm/user/' + uid);
            document.getElementById('crm-note').value = crmData.note;
            document.getElementById('crm-hist').innerHTML = crmData.history.map(function(historyItem) {
                return `<div onclick="viewTrans('${uid}','${historyItem.filename}')" class="p-2 bg-slate-900 border border-slate-800 rounded text-xs cursor-pointer hover:bg-slate-800 mb-1 text-slate-400">${new Date(historyItem.closedAt).toLocaleDateString()}</div>`;
            }).join('');
        }

        // Function: saveNote
        async function saveNote() {
            if(activeUser !== null) {
                await req('/api/crm/note', 'POST', { userId: activeUser, note: document.getElementById('crm-note').value });
            }
        }

        // Function: viewTrans
        async function viewTrans(uid, fileName) {
            const transcriptData = await req('/api/crm/transcript/' + uid + '/' + fileName);
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modal-content').innerHTML = transcriptData.history.map(function(m) {
                return `<div class="p-2 border-b border-slate-800 text-xs text-slate-300"><b>${m.authorTag}</b>: ${m.content}</div>`;
            }).join('');
        }

        // Function: changePW
        async function changePW() {
            const oldP = document.getElementById('pw-old').value;
            const newP = document.getElementById('pw-new').value;
            
            if(oldP === '' || newP === '') { 
                return alert("Please fill in both fields."); 
            }

            const response = await fetch('/api/staff/change-password', { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ currentPassword: oldP, newPassword: newP }) 
            });
            
            const resultData = await response.json();
            
            if(response.ok) {
                alert("Password Updated Successfully! Please login again.");
                window.location.href = '/login.html';
            } else {
                alert("Update Failed: " + resultData.error);
            }
        }

        // Function: isTyping
        function isTyping() { 
            if(activeId !== null) { 
                socket.emit('staff_typing', { threadId: activeId }); 
            } 
        }
        
        // Socket Bindings
        socket.on('new_message', function(payload) {
            if(payload.notif_sound === true) { document.getElementById('notif-sound').play(); }
            if(threadStore[payload.threadId]) {
                threadStore[payload.threadId].messages.push(payload);
                if(activeId === payload.threadId) { renderChat(); }
                loadThreads();
            } else { loadThreads(); }
        });

        socket.on('user_typing', function(payload) {
            if(activeUser === payload.userId) {
                const typingStatus = document.getElementById('typing');
                typingStatus.classList.remove('hidden');
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(function() { typingStatus.classList.add('hidden'); }, 3000);
            }
        });

        socket.on('viewers_updated', function(viewerList) {
            const viewerDisplay = document.getElementById('viewers');
            const otherStaff = viewerList.filter(function(name) { return name !== currentUser; });
            if(otherStaff.length > 0) {
                viewerDisplay.innerText = "👀 " + otherStaff.join(', ');
                viewerDisplay.classList.remove('hidden');
            } else {
                viewerDisplay.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
